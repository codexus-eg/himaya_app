# إعداد البناء السحابي (Codemagic) — يبني نسخة iOS ويرفعها إلى App Store Connect
# بدون الحاجة إلى جهاز Mac. يُرفع هذا الملف مع المشروع على GitHub، ثم يُربط
# المستودع من لوحة Codemagic فيلتقط الملف تلقائيًا.
#
# قبل أول تشغيل يلزم من لوحة Codemagic:
#   1) Teams > Integrations > App Store Connect: أضف مفتاح API باسم HimayaTrackASC
#      (يُنشأ من App Store Connect > Users and Access > Integrations > App Store Connect API)
#   2) Code signing: اختر Automatic ليتولّى Codemagic إنشاء الشهادات والملفات التعريفية
#
# ملاحظة: الإصدار يؤخذ من pubspec.yaml؛ ارفع رقم البناء قبل كل رفع جديد.

workflows:
  ios-release:
    name: Himaya Track — iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: HimayaTrackASC

    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.himayatrack.app
      vars:
        BUNDLE_ID: com.himayatrack.app

    scripts:
      - name: تثبيت حزم Flutter
        script: flutter pub get

      - name: تثبيت اعتماديات iOS (CocoaPods)
        script: |
          # Podfile يُولَّد تلقائيًا عند أول بناء إن لم يكن موجودًا
          find . -name "Podfile" -execdir pod install \; || true

      - name: تجهيز ملفات التوقيع
        script: xcode-project use-profiles

      - name: التحقق من التحليل الساكن
        script: flutter analyze lib || true

      - name: بناء ملف IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - mostafasaraya1995@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        # يرفع إلى TestFlight أولًا (يقابل الاختبار المغلق في Google Play).
        # بعد استقرار النسخة تُقدَّم للمراجعة من App Store Connect.
        submit_to_testflight: true
        submit_to_app_store: false
