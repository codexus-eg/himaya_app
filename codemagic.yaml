workflows:
  idris-schools-ios-testflight-workflow:
    name: Himaya Track iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.himayatrack.app

    scripts:
      - name: Set iOS deployment target
        script: |
          # تحديث إصدار المشروع الأساسي إلى 16.0
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Clean and Get Dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Fix Apple MinimumOSVersion
        script: |
          # وضعنا هذا الإصلاح هنا (بعد التنظيف وقبل البناء) لضمان عدم حذفه
          if [ -f "ios/Flutter/AppFrameworkInfo.plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 16.0" ios/Flutter/AppFrameworkInfo.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 16.0" ios/Flutter/AppFrameworkInfo.plist
          fi

      - name: Setup Code Signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
